[package]
name = "sim_frontend"
version = "0.1.0"
edition = "2021"
description = "sim3dviewライブラリを使ったサンプルアプリ。VAB・状況パネル・メニュー・sample/sim_server向けWebTransport固定長バイナリプロトコルなど、アプリ固有の部分を実装する(README.md参照)。"

[dependencies]
sim3dview = { path = "../.." }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "PointerEvent",
    "MouseEvent",
    "Location",
    "File",
    "FileList",
    "HtmlInputElement",
]
