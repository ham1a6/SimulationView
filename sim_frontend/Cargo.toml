[package]
name = "sim_frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-net = "0.7"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "PointerEvent",
    "WheelEvent",
    "Location",
    "HtmlCanvasElement",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
]

[profile.release]
opt-level = "s"
