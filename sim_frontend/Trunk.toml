[serve]
# LAN上の別端末からも http://<このPCのIP>:8081 でアクセスできるよう、全インターフェースで待ち受ける
# (既定はループバックのみ)。sim_server(9001番ポート)側もws_server.cppで"0.0.0.0"を明示している。
addresses = ["0.0.0.0"]
port = 8081
# trueにしないと、起動時にこのPCのネットワークインターフェース・ホスト名を列挙する処理が
# 走る。このマシンではDocker関連のネットワーク設定(kubernetes.docker.internal等)が絡むためか
# この列挙処理が数十秒〜長時間ハングし、実際のリッスン開始(バインド自体は一瞬で終わっている)
# より前にトンネルが使えるように見えてしまう問題があったため、無効化しておく。
disable_address_lookup = true
