name: Library

on: [push, pull_request, workflow_dispatch]

jobs:
  library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 前処理CLIのビルドと検証
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
          cmake -S tools/geotiff_preprocess -B tools/geotiff_preprocess/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build tools/geotiff_preprocess/build --parallel 2
          ctest --test-dir tools/geotiff_preprocess/build --output-on-failure
      - name: ライブラリの検証
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --locked
          cargo test --locked
